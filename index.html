<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <script>
      (() => {
        let theme = "system";
        try { theme = localStorage.getItem("xiao.appearance.theme") || "system"; } catch {}
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#171716" : "#f7f7f5";
      })();
    </script>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#f7f7f5}html[data-theme="dark"],html[data-theme="dark"] body,html[data-theme="dark"] #root{background:#171716}
      #xiao-boot{position:fixed;inset:0;display:grid;place-items:center;color:#262623;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}
      #xiao-boot>div{display:grid;min-width:148px;place-items:center;gap:4px}
      #xiao-boot .mark{display:grid;width:56px;height:56px;margin-bottom:7px;place-items:center;border:1px solid rgba(127,127,120,.16);border-radius:18px;background:rgba(255,255,255,.42);box-shadow:0 12px 34px rgba(20,20,18,.07)}
      #xiao-boot img{display:block;width:32px;height:32px;image-rendering:auto}
      #xiao-boot strong{font-size:16px;font-weight:650;letter-spacing:-.025em}
      #xiao-boot small{color:#777771;font-size:11px;font-weight:520;letter-spacing:.12em;text-transform:uppercase}
      #xiao-boot i{position:relative;width:54px;height:2px;margin-top:12px;overflow:hidden;border-radius:9px;background:rgba(127,127,120,.14)}
      #xiao-boot i::after{position:absolute;inset:0;width:42%;border-radius:inherit;background:#e78743;content:"";animation:xiao-boot-progress 1.05s ease-in-out infinite}
      @keyframes xiao-boot-progress{0%{transform:translateX(-125%)}50%{transform:translateX(72%)}100%{transform:translateX(240%)}}
      html[data-theme="dark"] #xiao-boot{color:#eeeeea}html[data-theme="dark"] #xiao-boot .mark{background:rgba(255,255,255,.045);box-shadow:0 12px 34px rgba(0,0,0,.18)}html[data-theme="dark"] #xiao-boot small{color:#96968f}
      @media(prefers-reduced-motion:reduce){#xiao-boot i::after{animation:none;transform:translateX(70%)}}
    </style>
    <link rel="icon" href="/xiao-mark.png" type="image/png" />
    <meta
      name="description"
      content="Xiao, a focused desktop workbench for coding agents."
    />
    <title>Xiao Workbench</title>
  </head>
